    source_parent_id: "parent_asin"
    upc: "product_details[UPC]"
    model_number: "product_details[model]"
    title: "title"
    brand_name: "brand"
    description: "description"
    current_price: "final_price"
    original_price: "initial_price"
    currency: "currency"
    rating: "rating"
    reviews_count: "reviews_count"
    rating_distribution: "amount_of_stars"
    customer_sentiment: "customer_says"
    images: "images"
    videos: "videos"
    specifications: "product_details"
    features: "features"
    category_path: "categories"
    availability_status: "availability"
    delivery_info: "delivery"
    seller_name: "seller_name"
    seller_id: "seller_id"
    seller_rating: "seller_rating"
    variant_group_id: "parent_asin"
    source_url: "url"
    scraped_at: "timestamp"
    badges: "badge"
    is_sponsored: "sponsored"
    is_prime: "amazon_prime"

  bestbuy:
    source_product_id: "sku"
    upc: "upc"
    model_number: "model"
    title: "title"
    brand_name: "product_specifications[Brand]"
    description: "product_description"
    current_price: "final_price"
    original_price: "initial_price"
    currency: "currency"
    rating: "rating"
    reviews_count: "reviews_count"
    rating_distribution: "amount_of_stars"
    images: "images"
    specifications: "product_specifications"
    features: "features"
    highlights: "highlights"
    category_path: "breadcrumbs"
    availability_status: "availability"
    seller_name: "BestBuy"
    source_url: "url"
    scraped_at: "timestamp"

  target:
    source_product_id: "tcin_id"
    upc: "upc"
    model_number: "product_specifications[model]"
    title: "title"
    brand_name: "product_brand"
    description: "product_description"
    current_price: "final_price"
    original_price: "initial_price"
    discount_percentage: "discount"
    currency: "currency"
    rating: "rating"
    reviews_count: "reviews_count"
    rating_distribution: "amount_of_stars"
    customer_sentiment: "what_customers_said"
    images: "images"
    specifications: "product_specifications"
    category_path: "breadcrumbs"
    availability_status: "availability_text"
    seller_name: "seller_name"
    source_url: "url"
    scraped_at: "timestamp"

  walmart:
    source_product_id: "product_id"
    upc: "upc"
    title: "title"
    brand_name: "brand"
    description: "description"
    current_price: "final_price"
    original_price: "initial_price"
    discount_amount: "discount"
    currency: "currency"
    rating: "rating"
    reviews_count: "reviews_count"
    rating_distribution: "rating_stars"
    customer_sentiment: "top_reviews"
    images: "image_urls"
    specifications: "specifications"
    category_path: "breadcrumbs"
    primary_category: "category_name"
    availability_status: "availability_text"
    seller_name: "seller_info"
    delivery_info: "store_name"
    source_url: "url"

# ============================================================================
# SEMANTIC FIELD GROUPINGS
# ============================================================================
field_groups:
  core_identity:
    description: "Core product identification fields"
    fields:
      - source_product_id
      - source
      - source_parent_id
      - upc
      - model_number
      - title
      - brand_name

  pricing:
    description: "Pricing and discount information"
    fields:
      - current_price
      - original_price
      - discount_amount
      - discount_percentage
      - currency

  ratings_reviews:
    description: "Customer ratings and reviews"
    fields:
      - rating
      - reviews_count
      - rating_distribution
      - customer_sentiment

  media:
    description: "Product images and videos"
    fields:
      - images
      - videos
      - primary_image

  product_details:
    description: "Product specifications and features"
    fields:
      - description
      - specifications
      - features
      - highlights

  categorization:
    description: "Category and taxonomy"
    fields:
      - category_path
      - primary_category
      - secondary_category
      - tertiary_category

  availability:
    description: "Stock and delivery information"
    fields:
      - availability_status
      - delivery_info

  seller:
    description: "Seller/merchant information"
    fields:
      - seller_name
      - seller_id
      - seller_rating

  variants:
    description: "Product variant information"
    fields:
      - has_variants
      - variant_attributes
      - variant_value
      - variant_group_id

  metadata:
    description: "Metadata and tracking"
    fields:
      - source_url
      - scraped_at
      - last_updated
      - badges
      - is_sponsored
      - is_prime
      - special_offers

# ============================================================================
# DATA QUALITY RULES
# ============================================================================
data_quality:
  required_fields:
    - source_product_id
    - source
    - title
    - source_url
    - currency

  rating_validation:
    min: 0.0
    max: 5.0

  price_validation:
    min: 0.0
    currency_required: true

  text_cleaning:
    strip_whitespace: true
    remove_control_chars: true
    normalize_unicode: true
    decode_html: true

# ============================================================================
# TRANSFORMATION RULES
# ============================================================================
transformations:
  normalize_brand:
    remove_suffixes:
      - " inc."
      - " inc"
      - " corp."
      - " corp"
      - " llc"
      - " ltd"
      - " electronics"
    lowercase: true
    strip: true

  normalize_availability:
    in_stock:
      - "in stock"
      - "available"
      - "add to cart"
      - "buy now"
    out_of_stock:
      - "out of stock"
      - "unavailable"
      - "sold out"
    limited_stock:
      - "limited"
      - "few left"
      - "low stock"
    preorder:
      - "preorder"
      - "pre-order"

  clean_numeric_id:
    remove_suffix: ".0"
    convert_to_string: true
