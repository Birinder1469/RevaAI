# ============================================================================
# UNIFIED PRODUCT SCHEMA CONFIGURATION
# ============================================================================
# Version: 2.0
# Last Updated: 2025-12-12
# Sources: Amazon, BestBuy, Target, Walmart
# ============================================================================

unified_schema:
  version: "2.0"
  last_updated: "2025-12-12"
  sources:
    - amazon
    - bestbuy
    - target
    - walmart

  # ============================================================================
  # UNIFIED FIELD DEFINITIONS
  # ============================================================================
  fields:
    # Core Product Information
    source_product_id:
      type: string
      required: true
      description: "Unique product ID from source (ASIN, SKU, TCIN, Product ID)"

    source:
      type: string
      required: true
      enum: [amazon, bestbuy, target, walmart]
      description: "Source retailer/company name"

    source_parent_id:
      type: string
      required: false
      description: "Parent product ID for variants"

    upc:
      type: string
      required: false
      description: "Universal Product Code"

    model_number:
      type: string
      required: false
      description: "Manufacturer model number"

    title:
      type: string
      required: true
      description: "Product title/name"

    brand_name:
      type: string
      required: false
      description: "Normalized brand name"

    description:
      type: string
      required: false
      description: "Product description"

    # Pricing Information
    current_price:
      type: float
      required: false
      description: "Current/final selling price"

    original_price:
      type: float
      required: false
      description: "Original/list/MSRP price"

    discount_amount:
      type: float
      required: false
      description: "Discount amount (original - current)"

    discount_percentage:
      type: float
      required: false
      description: "Discount percentage"

    currency:
      type: string
      required: true
      default: "USD"
      description: "Currency code (ISO 4217)"

    # Ratings & Reviews
    rating:
      type: float
      required: false
      min: 0.0
      max: 5.0
      description: "Product rating (0-5 scale)"

    reviews_count:
      type: integer
      required: false
      description: "Number of customer reviews"

    rating_distribution:
      type: dict
      required: false
      description: "Distribution of ratings by star level"

    customer_sentiment:
      type: string
      required: false
      description: "Customer feedback summary/highlights"

    # Media
    images:
      type: list
      required: false
      description: "List of product image URLs"

    videos:
      type: list
      required: false
      description: "List of product video URLs"

    primary_image:
      type: string
      required: false
      description: "Primary product image URL"

    # Product Details
    specifications:
      type: dict
      required: false
      description: "Product specifications as key-value pairs"

    features:
      type: list
      required: false
      description: "Product features/bullet points"

    highlights:
      type: list
      required: false
      description: "Product highlights"

    # Category Information
    category_path:
      type: string
      required: false
      description: "Full category hierarchy (breadcrumb)"

    primary_category:
      type: string
      required: false
      description: "Primary/top-level category"

    secondary_category:
      type: string
      required: false
      description: "Secondary category"

    tertiary_category:
      type: string
      required: false
      description: "Tertiary category"

    # Availability & Delivery
    availability_status:
      type: string
      required: false
      enum: [in_stock, out_of_stock, limited_stock, preorder]
      description: "Product availability status"

    delivery_info:
      type: string
      required: false
      description: "Delivery/shipping information"

    # Seller Information
    seller_name:
      type: string
      required: false
      description: "Seller/merchant name"

    seller_id:
      type: string
      required: false
      description: "Seller/merchant ID"

    seller_rating:
      type: float
      required: false
      description: "Seller rating"

    # Variant Information
    has_variants:
      type: boolean
      required: false
      description: "Product has variants (color, size, etc.)"

    variant_attributes:
      type: string
      required: false
      description: "Variant attribute type (e.g., 'Color', 'Size')"

    variant_value:
      type: string
      required: false
      description: "Variant value (e.g., 'Red', 'Large')"

    variant_group_id:
      type: string
      required: false
      description: "ID grouping all variants together"

    # Metadata
    source_url:
      type: string
      required: true
      description: "Product URL on source website"

    scraped_at:
      type: string
      required: false
      description: "Timestamp when data was scraped"

    last_updated:
      type: string
      required: false
      description: "Last update timestamp"

    badges:
      type: list
      required: false
      description: "Product badges (Best Seller, etc.)"

    is_sponsored:
      type: boolean
      required: false
      description: "Is product sponsored/promoted"

    is_prime:
      type: boolean
      required: false
      description: "Amazon Prime eligible"

    special_offers:
      type: string
      required: false
      description: "Special offers/promotions"

# ============================================================================
# SOURCE FIELD MAPPINGS
# ============================================================================
